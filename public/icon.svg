<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="needleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- Compass Rose Points -->
  <polygon points="256,70 266,110 246,110" fill="white" opacity="0.8" />
  <polygon points="256,442 266,402 246,402" fill="white" opacity="0.8" />
  <polygon points="70,256 110,246 110,266" fill="white" opacity="0.8" />
  <polygon points="442,256 402,246 402,266" fill="white" opacity="0.8" />

  <!-- Dynamic Voyage Paper Airplane / Compass Needle -->
  <path d="M 170 330 L 256 140 L 342 330 L 256 280 Z" fill="white" filter="url(#glow)" />
  <path d="M 256 140 L 256 280 L 170 330 Z" fill="#e0e7ff" />
  <path d="M 256 140 L 342 330 L 256 280 Z" fill="#c7d2fe" />
  
  <!-- Center Core -->
  <circle cx="256" cy="256" r="14" fill="url(#needleGold)" />
</svg>
