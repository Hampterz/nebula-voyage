<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06090e">
  <title>Shared Itinerary · Nebula Voyage</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  
  <style>
    .guest-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }
  </style>
</head>
<body>

  <div class="guest-container">
    <!-- Top Header -->
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="dock-brand-icon">
          <span class="material-symbols-outlined text-[20px]">explore</span>
        </div>
        <div>
          <span style="font-size: 16px; font-weight: 600; color: #ffffff;">Nebula Voyage</span>
          <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--water-accent); display: block;">Sovereign Companion View</span>
        </div>
      </div>
      <div class="dock-status-pill">
        <span class="dock-status-dot"></span>
        <span>Encrypted Read-Only</span>
      </div>
    </header>

    <!-- Trip Hero Slab -->
    <div id="shared-trip-hero" class="liquid-glass" style="padding: 32px; margin-bottom: 28px;">
      <div style="font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--water-accent); font-weight: 600; margin-bottom: 8px;">
        Verified Expedition Itinerary
      </div>
      <h1 id="share-title" style="font-size: 32px; font-weight: 500; color: #ffffff; margin-bottom: 8px;">Loading Expedition...</h1>
      <p id="share-desc" style="font-size: 14.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px;"></p>
      
      <div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13.5px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px;">
        <span style="display: flex; align-items: center; gap: 6px; color: #ffffff;">
          <span class="material-symbols-outlined text-[16px]">location_on</span>
          <span id="share-dest">Loading...</span>
        </span>
        <span style="opacity: 0.3;">•</span>
        <span id="share-dates"></span>
        <span style="opacity: 0.3;">•</span>
        <span id="share-stops-count"></span>
      </div>
    </div>

    <!-- Timeline Stops -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <h2 style="font-size: 20px; font-weight: 500; color: #ffffff;">Day-by-Day Timeline</h2>
    </div>

    <div id="share-timeline-container" class="timeline-flow-container">
      <div class="timeline-step-line"></div>
      <div id="share-items-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script>
    async function loadSharedTrip() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (!token) {
        document.getElementById('share-title').textContent = 'Invalid or Missing Share Token';
        return;
      }

      try {
        const res = await fetch(`/api/share/${token}`);
        if (!res.ok) throw new Error('Expedition not found');
        const trip = await res.json();

        document.getElementById('share-title').textContent = trip.title;
        document.getElementById('share-desc').textContent = trip.notes || 'Curated travel plan shared securely from a sovereign Umbrel node.';
        document.getElementById('share-dest').textContent = trip.destination;
        document.getElementById('share-dates').textContent = `${trip.startDate} to ${trip.endDate}`;
        document.getElementById('share-stops-count').textContent = `${(trip.items || []).length} Stops`;

        const listContainer = document.getElementById('share-items-list');
        const items = (trip.items || []).sort((a,b) => (a.day - b.day) || (a.time || '').localeCompare(b.time || ''));

        if (items.length === 0) {
          listContainer.innerHTML = `<p style="color: var(--text-muted);">No stops in this itinerary yet.</p>`;
          return;
        }

        listContainer.innerHTML = items.map((item, index) => {
          const stepNumber = String(index + 1).padStart(2, '0');
          const mapQuery = encodeURIComponent(item.location || item.title);
          const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

          return `
            <article class="liquid-glass itinerary-item-card" style="margin-bottom: 20px;">
              <div class="timeline-step-node">${stepNumber}</div>

              <div class="item-card-header">
                <div class="item-time-badge">
                  <span class="material-symbols-outlined text-[16px]">place</span>
                  <span>Day ${item.day} • ${item.time || 'Flexible'} (${item.timeBlock || 'Day'})</span>
                </div>
                <span style="font-size: 11px; text-transform: uppercase; padding: 2px 8px; border-radius: 9999px; background: rgba(255,255,255,0.08); color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.12);">
                  ${item.category || 'Stop'}
                </span>
              </div>

              <h3 class="item-title">${escapeHtml(item.title)}</h3>
              ${item.notes ? `<p class="item-notes">${escapeHtml(item.notes)}</p>` : ''}

              <div class="item-meta-footer">
                <div style="color: var(--text-muted);">
                  ${escapeHtml(item.location || '')}
                </div>
                <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer" style="color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 4px; font-weight: 500;">
                  <span>Open in Maps</span>
                  <span class="material-symbols-outlined text-[14px]">open_in_new</span>
                </a>
              </div>
            </article>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        document.getElementById('share-title').textContent = 'Expedition Not Found';
        document.getElementById('share-desc').textContent = 'The link may have expired or the voyage was removed by the host node.';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', loadSharedTrip);
  </script>
</body>
</html>
